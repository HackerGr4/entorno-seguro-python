services:
  app:
    build: .
    env_file:
      - .env
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

