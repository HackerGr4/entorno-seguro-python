name: Validate Python container demo

on:
  push:
    branches: [main, kit-seguridad-python]
  pull_request:

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile app.py
      - name: Build and run the demo
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --build
          test "$(docker compose exec -T app id -u)" != "0"
          docker compose exec -T app sh -c 'test ! -w /app'
          docker compose logs --no-color app | grep -F 'Hola, este es mi entorno seguro profesional'
      - name: Stop the demo
        if: always()
        run: docker compose down --remove-orphans

